[workspace]
resolver = "2"
members = ["crates/cyanrip-core", "crates/cyanrip-cli", "crates/cyanrip-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
libc = "0.2"
tokio = { version = "1", features = [
    "process", "io-util", "sync", "time", "rt-multi-thread", "macros", "fs", "signal",
] }
async-channel = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
gtk = { package = "gtk4", version = "0.9", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_4", "v1_5"] }
gettext-rs = "0.7"
sha1 = "0.10"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = "thin"
strip = true
