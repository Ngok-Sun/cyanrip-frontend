<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="0.45" stop-color="#d5d3d1"/>
      <stop offset="0.55" stop-color="#b9b6b3"/>
      <stop offset="1" stop-color="#e6e4e2"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>

  <!-- CD -->
  <circle cx="64" cy="62" r="38" fill="url(#disc)"/>
  <circle cx="64" cy="62" r="38" fill="none" stroke="#1a5fb4" stroke-width="3"/>
  <!-- 反光弧 -->
  <path d="M 36 40 A 34 34 0 0 1 92 40" fill="none" stroke="#ffffff" stroke-opacity="0.75"
        stroke-width="5" stroke-linecap="round"/>
  <!-- 中心孔 -->
  <circle cx="64" cy="62" r="9" fill="#1c71d8"/>
  <circle cx="64" cy="62" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>

  <!-- 抓轨箭头（向下） -->
  <path d="M 64 104 L 64 116" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M 55 108 L 64 118 L 73 108" fill="none" stroke="#ffffff" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
